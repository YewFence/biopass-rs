name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_ENV: "ci"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: node rust bun viteplus
          add_shims_to_path: true
          cache_key: "mise-v1-{{platform}}-{{install_args_hash}}-{{file_hash}}"

      - name: Install system dependencies
        run: |
          sudo apt update
          mise bootstrap --yes

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-check-${{ runner.os }}-
            cargo-${{ runner.os }}-

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.bun/install/cache
            apps/desktop/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('apps/desktop/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Run checks
        run: mise run check

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_ENV: "ci"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: rust cargo:cargo-llvm-cov
          add_shims_to_path: true
          cache_key: "mise-v1-{{platform}}-coverage-{{install_args_hash}}-{{file_hash}}"

      - name: Install system dependencies
        run: |
          sudo apt update
          mise bootstrap --yes

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-coverage-${{ runner.os }}-
            cargo-${{ runner.os }}-

      - name: Generate core Rust coverage
        run: mise run coverage-rust-codecov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust-core
          name: rust-core
          fail_ci_if_error: true

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_ENV: "ci"
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install_args: 'rust "cargo:cargo-audit"'
          add_shims_to_path: true

      - name: Run audit
        run: mise run audit-rust

  audit-report:
    name: Audit report
    runs-on: ubuntu-24.04
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_ENV: "ci"
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install_args: 'rust "cargo:cargo-audit"'
          add_shims_to_path: true

      - name: Run full audit (informational)
        run: |
          {
            echo "## cargo audit report"
            echo
            echo "_Generated by \`cargo audit\` on $(date -u '+%Y-%m-%d %H:%M:%S UTC'). Informational only — non-vulnerability warnings do not fail this job._"
            echo
            echo '```'
            mise run audit-rust || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
